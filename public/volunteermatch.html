<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Events</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="myscripts.js"></script>
</head>
<body>
<div class="container">
    <h1>All Events</h1>

    <!-- Button to filter events by skills -->
    <button onclick="filterEventsBySkills()">Filter Events by Skills</button>

    <div id="events-list"></div> <!-- This is where events will be dynamically added -->
</div>

<script>
    // Variable to store all fetched events
    let allEvents = [];

    // Fetch all events from the server
    async function fetchEvents() {
        try {
            const response = await fetch('/api/events');
            if (response.ok) {
                allEvents = await response.json();
                displayEvents(allEvents);  // Display all events initially
            } else {
                console.error('Error fetching events:', response.statusText);
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // Fetch and display events filtered by skills
    function filterEventsBySkills() {
        const userSkills = ['Skill1', 'Skill2', 'Skill3']; // Get the user's skills (replace with actual user data)

        // Log the user skills
        console.log("User Skills:", userSkills);

        // Filter events based on skills match
        const filteredEvents = allEvents.filter(event => {
            // Log the event's required skills for debugging
            console.log("Event Required Skills:", event.requiredSkills);

            // Check if there's any match between user's skills and required skills (case-insensitive)
            return event.requiredSkills.some(skill =>
                userSkills.some(userSkill => userSkill.toLowerCase() === skill.toLowerCase())
            );
        });

        // Log the filtered events
        console.log("Filtered Events:", filteredEvents);

        // Display filtered events
        displayEvents(filteredEvents);
    }

    // Function to display events in the HTML
    function displayEvents(events) {
        const eventsList = document.getElementById('events-list');
        eventsList.innerHTML = ''; // Clear the current content

        if (events.length === 0) {
            eventsList.innerHTML = '<p>No events available</p>';
            return;
        }

        events.forEach(event => {
            const eventDiv = document.createElement('div');
            eventDiv.classList.add('event');
            eventDiv.innerHTML = `
                    <h3>${event.eventName}</h3>
                    <p><strong>Description:</strong> ${event.eventDescription}</p>
                    <p><strong>Location:</strong> ${event.location}</p>
                    <p><strong>Skills Required:</strong> ${event.requiredSkills.join(', ')}</p>
                    <p><strong>Urgency:</strong> ${event.urgency}</p>
                    <p><strong>Event Date:</strong> ${new Date(event.eventDate).toLocaleDateString()}</p>
                `;
            eventsList.appendChild(eventDiv);
        });
    }

    // Fetch and display the events when the page loads
    window.onload = fetchEvents;
</script>
</body>
</html>
