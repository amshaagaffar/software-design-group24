<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
</head>

<body>
<header>
    <nav>
        <div class="logo">
            Hands2Help
        </div>

        <div class="menu-container">
            <div class="menu">

                <a href="userprofileview.html">Account</a>
            </div>

            <div id="notification-container">
                <button class="noti" id="notification-button">
                    <img src="resources/notification-newdot-line.svg" alt="Notification" class="noti-button">
                </button>
                <div id="notification-bubble" class="hidden">
                    <p id="notification-message"></p>
                </div>
            </div>

            <button id="signout-button" onclick="signOut()" class="signout-button">Sign Out</button>
        </div>
    </nav>
</header>

<div class="dashboard-content">
    <div class="dash-header">
        <h1>Welcome to your Dashboard!</h1>
        <p id="user-email" class="user-email"><!-- Placeholder for user email --></p>
    </div>

    <div class="dashboard-navigation">
        <ul>
            <li><a href="getallevents.html">Event Matching</a></li>
            <li><a href="volunteerhistory.html">Volunteer History</a></li>
            <li><a href="userprofileview.html">Account</a></li>
        </ul>
    </div>
</div>

<!-- JavaScript -->
<script>
    // Get user info from JWT token
    function getUserInfo() {
        const token = localStorage.getItem('token'); // Get token from localStorage
        if (token) {
            const payload = JSON.parse(atob(token.split('.')[1])); // Decode the JWT payload
            const now = Date.now() / 1000; // Current time in seconds

            // Check if the token is expired
            if (payload.exp > now) {
                return { email: payload.email, role: payload.role }; // Return email and role if valid
            } else {
                localStorage.removeItem('token'); // Remove expired token
                alert('Your session has expired. Please log in again.');
                window.location.href = 'Login.html'; // Redirect to login page
            }
        }
        return null; // Return null if no token is found
    }

    // Display user email on the dashboard
    const userInfo = getUserInfo();
    if (userInfo) {
        document.getElementById('user-email').textContent = 'Your Email: ' + userInfo.email; // Display email
    } else {
        document.getElementById('user-email').textContent = 'You are not logged in.';
        window.location.href = 'Login.html'; // Redirect to login page if not logged in
    }

    // Sign out function
    function signOut() {
        localStorage.removeItem('token'); // Remove token from localStorage
        alert('You have been signed out.');
        window.location.href = 'Login.html'; // Redirect to login page
    }

    document.addEventListener('DOMContentLoaded', function() {
        // No default section to load on page load
    });
</script>



<script>
    document.getElementById('notification-button').addEventListener('click', async () => {
        try {
            const token = localStorage.getItem('token'); // Get the JWT token
            if (!token) throw new Error('User is not logged in');

            const response = await fetch('/api/notifications/reminders', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error('Failed to fetch reminders');

            const data = await response.json();

            const reminders = data.reminders;
            if (reminders.length > 0) {
                const message = reminders.map(r =>
                    `Event: ${r.eventName}\nDate: ${new Date(r.eventDate).toLocaleDateString()}\nLocation: ${r.location}`
                ).join('\n\n');
                document.getElementById('notification-message').innerText = message;
            } else {
                document.getElementById('notification-message').innerText = 'No upcoming events!';
            }

            // Show the bubble
            const bubble = document.getElementById('notification-bubble');
            bubble.classList.add('visible');

            // Auto-hide after 5 seconds
            setTimeout(() => {
                bubble.classList.remove('visible');
            }, 5000);
        } catch (error) {
            console.error(error);
            alert(error.message);
        }
    });
</script>


</body>
</html>
