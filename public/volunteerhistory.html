<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer History</title>
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="styles2.css">
    <style>
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .status-signed_up {
            background-color: #007bff;
            color: white;
        }
        .status-completed {
            background-color: #28a745;
            color: white;
        }
        .status-cancelled {
            background-color: #dc3545;
            color: white;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        .action-button {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }
        .cancel-button {
            background-color: #dc3545;
            color: white;
        }
        .complete-button {
            background-color: #28a745;
            color: white;
        }
        .feedback-button {
            background-color: #17a2b8;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 500px;
        }
        .close {
            float: right;
            cursor: pointer;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <div class="logo">Hands2Help</div>
        <div class="menu-container">
            <div class="menu"></div>
            <div id="notification-container">
                <button class="noti" id="notification-button">
                    <img src="resources/notification-newdot-line.svg" alt="Notification" class="noti-button">
                </button>
                <div id="notification-bubble" class="hidden">
                    <p id="notification-message"></p>
                </div>
            </div>
            <button id="signout-button" onclick="signOut()" class="signout-button">Sign Out</button>
        </div>
    </nav>
</header>
<h1>Volunteer Participation History</h1>

<table>
    <thead>
    <tr>
        <th>Event Name</th>
        <th>Event Date</th>
        <th>Location</th>
        <th>Status</th>
        <th>Sign-up Date</th>
        <th>Hours Served</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="volunteer-history">
    <!-- Rows will be dynamically populated here -->
    </tbody>
</table>

<!-- Feedback Modal -->
<div id="feedbackModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Provide Feedback</h2>
        <input type="hidden" id="currentHistoryId">
        <textarea id="feedbackText" rows="4" style="width: 100%; margin: 10px 0;"></textarea>
        <input type="number" id="hoursServed" placeholder="Hours served" style="width: 100%; margin: 10px 0;">
        <button onclick="submitFeedback()" class="action-button complete-button">Submit Feedback</button>
    </div>
</div>

<script>
    let modal = document.getElementById('feedbackModal');
    let span = document.getElementsByClassName('close')[0];

    span.onclick = function() {
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }

    async function loadVolunteerHistory() {
        const token = localStorage.getItem('token');

        if (!token) {
            alert('You must be logged in to view this page.');
            window.location.href = '/login.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:3000/api/volunteer-history', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch volunteer history');
            }

            const data = await response.json();
            displayVolunteerHistory(data);
        } catch (error) {
            console.error('Error fetching volunteer history:', error);
            alert('Unable to fetch volunteer history at this time. Please try again later.');
        }
    }

    function displayVolunteerHistory(history) {
        const tbody = document.getElementById('volunteer-history');
        tbody.innerHTML = '';

        if (!history.length) {
            tbody.innerHTML = '<tr><td colspan="7">No volunteer history found.</td></tr>';
            return;
        }

        history.forEach(record => {
            const row = document.createElement('tr');
            const event = record.eventId;

            row.innerHTML = `
                <td>${event.eventName}</td>
                <td>${new Date(event.eventDate).toLocaleDateString()}</td>
                <td>${event.location}</td>
                <td><span class="status-badge status-${record.status}">${record.status}</span></td>
                <td>${new Date(record.signupDate).toLocaleDateString()}</td>
                <td>${record.hoursServed || '-'}</td>
                <td class="action-buttons">
                    ${getActionButtons(record)}
                </td>
            `;

            tbody.appendChild(row);
        });
    }

    function getActionButtons(record) {
        if (record.status === 'signed_up') {
            return `
                <button onclick="cancelSignup('${record._id}')" class="action-button cancel-button">Cancel</button>
                <button onclick="openFeedbackModal('${record._id}')" class="action-button complete-button">Complete</button>
            `;
        } else if (record.status === 'completed') {
            return `
                <button onclick="openFeedbackModal('${record._id}')" class="action-button feedback-button">Update Feedback</button>
            `;
        }
        return '';
    }

    async function cancelSignup(historyId) {
        if (!confirm('Are you sure you want to cancel this event signup?')) {
            return;
        }

        try {
            const response = await fetch(`http://localhost:3000/api/volunteer-history/${historyId}/cancel`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                alert('Successfully cancelled event signup');
                loadVolunteerHistory();
            } else {
                throw new Error('Failed to cancel signup');
            }
        } catch (error) {
            console.error('Error cancelling signup:', error);
            alert('Failed to cancel signup. Please try again later.');
        }
    }

    function openFeedbackModal(historyId) {
        document.getElementById('currentHistoryId').value = historyId;
        document.getElementById('feedbackText').value = '';
        document.getElementById('hoursServed').value = '';
        modal.style.display = "block";
    }

    async function submitFeedback() {
        const historyId = document.getElementById('currentHistoryId').value;
        const feedback = document.getElementById('feedbackText').value;
        const hoursServed = document.getElementById('hoursServed').value;

        try {
            const response = await fetch(`http://localhost:3000/api/volunteer-history/${historyId}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    status: 'completed',
                    feedback,
                    hoursServed: Number(hoursServed)
                })
            });

            if (response.ok) {
                alert('Successfully updated volunteer record');
                modal.style.display = "none";
                loadVolunteerHistory();
            } else {
                throw new Error('Failed to update record');
            }
        } catch (error) {
            console.error('Error updating record:', error);
            alert('Failed to update record. Please try again later.');
        }
    }

    function signOut() {
        localStorage.removeItem('token');
        alert('You have been signed out.');
        window.location.href = '/login.html';
    }

    async function fetchUserRole() {
        const token = localStorage.getItem('token');
        if (!token) {
            console.error('No token found');
            return;
        }

        try {
            const response = await fetch('/getRole', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                return data.role;
            } else {
                console.error('Failed to fetch role');
                return null;
            }
        } catch (err) {
            console.error('Error fetching role:', err);
            return null;
        }
    }

    async function updateNavBasedOnRole() {
        const role = await fetchUserRole();
        const menuContainer = document.querySelector('.menu');

        if (role === 'admin') {
            menuContainer.innerHTML += `
                <a href="admin_dashboard.html">Dashboard</a>
                <a href="event_list.html">Events</a>
            `;
        } else if (role === 'volunteer') {
            menuContainer.innerHTML += `
                <a href="user_dashboard.html">Dashboard</a>
                <a href="volunteerhistory.html">My History</a>
            `;
        } else {
            menuContainer.innerHTML += `<a href="Home.html">Home</a>`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateNavBasedOnRole();
        loadVolunteerHistory();
    });
</script>

<script>
    document.getElementById('notification-button').addEventListener('click', async () => {
        try {
            const token = localStorage.getItem('token'); // Get the JWT token
            if (!token) throw new Error('User is not logged in');

            const response = await fetch('/api/notifications/reminders', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) throw new Error('Failed to fetch reminders');

            const data = await response.json();

            const reminders = data.reminders;
            if (reminders.length > 0) {
                const message = reminders.map(r =>
                    `Event: ${r.eventName}\nDate: ${new Date(r.eventDate).toLocaleDateString()}\nLocation: ${r.location}`
                ).join('\n\n');
                document.getElementById('notification-message').innerText = message;
            } else {
                document.getElementById('notification-message').innerText = 'No upcoming events!';
            }

            // Show the bubble
            const bubble = document.getElementById('notification-bubble');
            bubble.classList.add('visible');

            // Auto-hide after 5 seconds
            setTimeout(() => {
                bubble.classList.remove('visible');
            }, 5000);
        } catch (error) {
            console.error(error);
            alert(error.message);
        }
    });
</script>

</body>
</html>
