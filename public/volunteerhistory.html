<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer History</title>
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
<header>
    <nav>
        <div class="logo">Hands2Help</div>
        <div class="menu-container">
            <div class="menu"></div> <!-- The menu will be populated dynamically -->
            <button class="noti" id="notification-button">
                <img src="resources/notification-newdot-line.svg" alt="Notification" class="noti-button">
            </button>
            <button id="signout-button" onclick="signOut()" class="signout-button">Sign Out</button>
        </div>
    </nav>
</header>
<h1>Volunteer Participation History</h1>

<table>
    <thead>
    <tr>
        <th>Event Name</th>
        <th>Event Description</th>
        <th>Location</th>
        <th>Required Skills</th>
        <th>Urgency</th>
        <th>Event Date</th>
        <th>Participation Status</th>
    </tr>
    </thead>
    <tbody id="volunteer-history">
    <!-- Rows will be dynamically populated here -->
    </tbody>
</table>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login.html'; // Redirect to login if no token
            return;
        }

        fetch('/volunteerhistory', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    alert(data.message);
                    return;
                }

                const tbody = document.getElementById("volunteer-history");

                data.forEach(event => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${event.eventName}</td>
                        <td>${event.eventDescription}</td>
                        <td>${event.location}</td>
                        <td>${event.requiredSkills.join(", ")}</td>
                        <td>${event.urgency}</td>
                        <td>${event.eventDate}</td>
                        <td>${event.participationStatus}</td>
                    `;

                    tbody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error:', error);
            });
    });
</script>
<!-- SIGN OUT LOGIC -->
<script>
    function signOut() {
        localStorage.removeItem('token'); // Remove token from localStorage
        alert('You have been signed out.');
        window.location.href = 'Login.html'; // Redirect to login page
    }

    document.addEventListener('DOMContentLoaded', function() {
        // No default section to load on page load
    });
</script>
<!--Dash-->
<script>
    async function fetchUserRole() {
        const token = localStorage.getItem('token');
        if (!token) {
            console.error('No token found');
            return;
        }

        try {
            const response = await fetch('/getRole', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                return data.role;
            } else {
                console.error('Failed to fetch role');
                return null;
            }
        } catch (err) {
            console.error('Error fetching role:', err);
            return null;
        }
    }

    async function updateNavBasedOnRole() {
        const role = await fetchUserRole();

        const menuContainer = document.querySelector('.menu');

        if (role === 'admin') {
            menuContainer.innerHTML += `
        <a href="admin_dashboard.html">Dashboard</a>
      `;
        } else if (role === 'volunteer') {
            menuContainer.innerHTML += `
        <a href="user_dashboard.html">Dashboard</a>
      `;
        } else {
            menuContainer.innerHTML += `
        <a href="Home.html">Home</a>
      `;
        }
    }

    // Run the function to update the navigation on page load
    document.addEventListener('DOMContentLoaded', updateNavBasedOnRole);
</script>
</body>
</html>
