<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event List</title>
  <style>
    .event {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
    }

    .no-events {
      color: red;
      font-style: italic;
    }
  </style>
</head>
<body>
<h1>Event List</h1>

<!-- Container to display events -->
<div id="events-container">
  <!-- Events will be loaded here -->
</div>

<script>
  let allEvents = [];
  let userSkills = [];

  // Function to fetch all events from the backend
  async function loadAllEvents() {
    try {
      const response = await fetch('http://localhost:3000/api/events', {
        headers: {
          'Authorization': 'Bearer ' + localStorage.getItem('token') // Ensure the token is passed
        }
      });

      if (!response.ok) {
        throw new Error('Error fetching events');
      }

      allEvents = await response.json();
      filterAndDisplayEvents();  // Filter events after fetching them
    } catch (error) {
      console.error('Error fetching events:', error);
    }
  }

  // Function to fetch the logged-in user's profile (including skills)
  async function loadUserProfile() {
    try {
      const response = await fetch('http://localhost:3000/userprofile', {
        headers: {
          'Authorization': 'Bearer ' + localStorage.getItem('token') // Assuming token is in localStorage
        }
      });

      if (!response.ok) {
        throw new Error('Error fetching user profile');
      }

      const userProfile = await response.json();
      userSkills = userProfile.skills || [];  // Get skills from the user's profile, default to empty array
      loadAllEvents();  // Load all events after fetching the user profile
    } catch (error) {
      console.error('Error fetching user profile:', error);
    }
  }

  // Function to filter and display events based on user skills
  function filterAndDisplayEvents() {
    const filteredEvents = allEvents.filter(event => {
      return event.requiredSkills.some(skill => userSkills.includes(skill));  // Match at least one skill
    });

    displayEvents(filteredEvents);  // Display the filtered events
  }

  // Function to display events on the page
  function displayEvents(events) {
    const eventsContainer = document.getElementById('events-container');
    eventsContainer.innerHTML = '';  // Clear the current events displayed

    if (events.length === 0) {
      eventsContainer.innerHTML = '<p class="no-events">No events found matching your skills.</p>';
      return;
    }

    events.forEach(event => {
      const eventDiv = document.createElement('div');
      eventDiv.classList.add('event');
      eventDiv.innerHTML = `
                    <h2>${event.eventName}</h2>
                    <p>${event.eventDescription}</p>
                    <p>Location: ${event.location}</p>
                    <p>Skills: ${event.requiredSkills.join(', ')}</p>
                    <p>Urgency: ${event.urgency}</p>
                    <p>Date: ${formatDate(event.eventDate)}</p>
                `;
      eventsContainer.appendChild(eventDiv);
    });
  }

  // Function to format event date to a more user-friendly format
  function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString(); // Customize the format if needed
  }

  // Function to initialize the page by loading events and user profile
  async function initializePage() {
    await loadUserProfile(); // Load user profile and skills
  }

  // Load everything when the page is loaded
  window.onload = initializePage;
</script>
</body>
</html>
