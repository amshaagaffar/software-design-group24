<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    form {
      display: grid;
      gap: 15px;
    }
    label {
      font-weight: bold;
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type="submit"] {
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #45a049;
    }
    .required::after {
      content: " *";
      color: red;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>User Profile Management</h1>
  <form>
    <div>
      <label for="fullName" class="required">Full Name:</label>
      <input
              type="text"
              id="fullName"
              name="fullName"
              maxlength="50"
              required
      />
    </div>
    <div>
      <label for="address1" class="required">Address 1:</label>
      <input
              type="text"
              id="address1"
              name="address1"
              maxlength="100"
              required
      />
    </div>
    <div>
      <label for="address2">Address 2:</label>
      <input type="text" id="address2" name="address2" maxlength="100" />
    </div>
    <div>
      <label for="city" class="required">City:</label>
      <input type="text" id="city" name="city" maxlength="100" required />
    </div>
    <div>
      <label for="state" class="required">State:</label>
      <select id="state" name="state" required>
        <option value="">Select a state</option>
        <option value="AL">Alabama</option>
        <option value="AK">Alaska</option>
        <option value="AZ">Arizona</option>
        <option value="AR">Arkansas</option>
        <option value="CA">California</option>
        <option value="CO">Colorado</option>
        <option value="CT">Connecticut</option>
        <option value="DE">Delaware</option>
        <option value="FL">Florida</option>
        <option value="GA">Georgia</option>
        <option value="HI">Hawaii</option>
        <option value="ID">Idaho</option>
        <option value="IL">Illinois</option>
        <option value="IN">Indiana</option>
        <option value="IA">Iowa</option>
        <option value="KS">Kansas</option>
        <option value="KY">Kentucky</option>
        <option value="LA">Louisiana</option>
        <option value="ME">Maine</option>
        <option value="MD">Maryland</option>
        <option value="MA">Massachusetts</option>
        <option value="MI">Michigan</option>
        <option value="MN">Minnesota</option>
        <option value="MS">Mississippi</option>
        <option value="MO">Missouri</option>
        <option value="MT">Montana</option>
        <option value="NE">Nebraska</option>
        <option value="NV">Nevada</option>
        <option value="NH">New Hampshire</option>
        <option value="NJ">New Jersey</option>
        <option value="NM">New Mexico</option>
        <option value="NY">New York</option>
        <option value="NC">North Carolina</option>
        <option value="ND">North Dakota</option>
        <option value="OH">Ohio</option>
        <option value="OK">Oklahoma</option>
        <option value="OR">Oregon</option>
        <option value="PA">Pennsylvania</option>
        <option value="RI">Rhode Island</option>
        <option value="SC">South Carolina</option>
        <option value="SD">South Dakota</option>
        <option value="TN">Tennessee</option>
        <option value="TX">Texas</option>
        <option value="UT">Utah</option>
        <option value="VT">Vermont</option>
        <option value="VA">Virginia</option>
        <option value="WA">Washington</option>
        <option value="WV">West Virginia</option>
        <option value="WI">Wisconsin</option>
        <option value="WY">Wyoming</option>
      </select>
    </div>
    <div>
      <label for="zipcode" class="required">Zip code:</label>
      <input
              type="text"
              id="zipcode"
              name="zipcode"
              pattern="[0-9]{5}([0-9]{4})?"
              maxlength="9"
              required
      />
    </div>
    <div>
      <label for="skills" class="required">Skills:</label>
      <select id="skills" name="skills" multiple required>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <!-- Add more skills as needed -->
      </select>
    </div>
    <div>
      <label for="preferences">Preferences:</label>
      <textarea id="preferences" name="preferences" rows="4"></textarea>
    </div>
    <div>
      <label for="availability" class="required">Availability:</label>
      <input
              type="date"
              id="availability"
              name="availability"
              required
              multiple
      />
    </div>
    <div>
      <input type="submit" value="Save Profile" />
    </div>
  </form>
</div>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Fetch the current user profile
    try {
      const response = await fetch('/userprofile', {
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        }
      });
      const profile = await response.json();

      if (profile) {
        document.getElementById('fullName').value = profile.fullName || '';
        document.getElementById('address1').value = profile.address1 || '';
        document.getElementById('address2').value = profile.address2 || '';
        document.getElementById('city').value = profile.city || '';
        document.getElementById('state').value = profile.state || '';
        document.getElementById('zipcode').value = profile.zipcode || '';
        document.getElementById('skills').value = profile.skills.join(', ') || '';
        document.getElementById('preferences').value = profile.preferences || '';
        document.getElementById('availability').value = profile.availability ? profile.availability.split('T')[0] : '';
      }
    } catch (err) {
      console.error('Error fetching profile:', err);
    }
  });

  async function saveProfile(event) {
    event.preventDefault();

    // Collect all selected skills as an array
    const selectedSkills = Array.from(document.getElementById('skills').selectedOptions)
            .map(option => option.value);

    const profileData = {
      fullName: document.getElementById('fullName').value,
      address1: document.getElementById('address1').value,
      address2: document.getElementById('address2').value,
      city: document.getElementById('city').value,
      state: document.getElementById('state').value,
      zipcode: document.getElementById('zipcode').value,
      skills: selectedSkills,  // Send the array of selected skills
      preferences: document.getElementById('preferences').value,
      availability: document.getElementById('availability').value
    };

    try {
      const response = await fetch('/userprofile', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify(profileData)
      });

      if (response.ok) {
        alert('Profile updated successfully');
        window.location.href = 'userprofileview.html'; // Redirect to the profile view page
      } else {
        alert('Failed to update profile');
      }
    } catch (err) {
      console.error('Error saving profile:', err);
    }
  }

  document.querySelector('form').addEventListener('submit', saveProfile);
</script>
</body>
</html>
