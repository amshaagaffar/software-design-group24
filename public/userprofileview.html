<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile View</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .profile-info {
      display: grid;
      gap: 15px;
    }
    .info-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
    .value {
      margin-top: 5px;
      color: #333;
    }
    .button-container {
      text-align: center;
      margin-top: 20px;
    }
    .edit-button {
      background-color: #4caf50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      font-size: 16px;
    }
    .edit-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>User Profile</h1>
  <div class="profile-info">
    <div class="info-item">
      <div class="label">Full Name:</div>
      <div class="value" id="fullName"></div>
    </div>
    <div class="info-item">
      <div class="label">Address 1:</div>
      <div class="value" id="address1"></div>
    </div>
    <div class="info-item">
      <div class="label">Address 2:</div>
      <div class="value" id="address2"></div>
    </div>
    <div class="info-item">
      <div class="label">City:</div>
      <div class="value" id="city"></div>
    </div>
    <div class="info-item">
      <div class="label">State:</div>
      <div class="value" id="state"></div>
    </div>
    <div class="info-item">
      <div class="label">Zip code:</div>
      <div class="value" id="zipcode"></div>
    </div>
    <div class="info-item">
      <div class="label">Skills:</div>
      <div class="value" id="skills"></div>
    </div>
    <div class="info-item">
      <div class="label">Preferences:</div>
      <div class="value" id="preferences"></div>
    </div>
    <div class="info-item">
      <div class="label">Availability:</div>
      <div class="value" id="availability"></div>
    </div>
  </div>
  <div class="button-container">
    <!-- Button to redirect to the Edit Profile page -->
    <a href="userprofile.html" class="edit-button">Edit Profile</a>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      // Fetch the current user profile data from the server
      const response = await fetch('/userprofile', {
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        }
      });

      if (response.ok) {
        const profile = await response.json();

        // Populate the profile information in the read-only view
        document.getElementById('fullName').textContent = profile.fullName || 'N/A';
        document.getElementById('address1').textContent = profile.address1 || 'N/A';
        document.getElementById('address2').textContent = profile.address2 || 'N/A';
        document.getElementById('city').textContent = profile.city || 'N/A';
        document.getElementById('state').textContent = profile.state || 'N/A';
        document.getElementById('zipcode').textContent = profile.zipcode || 'N/A';
        document.getElementById('skills').textContent = profile.skills ? profile.skills.join(', ') : 'N/A';
        document.getElementById('preferences').textContent = profile.preferences || 'N/A';
        document.getElementById('availability').textContent = profile.availability || 'N/A';
      } else {
        console.error('Failed to fetch profile');
      }
    } catch (err) {
      console.error('Error fetching profile:', err);
    }
  });
</script>
</body>
</html>
