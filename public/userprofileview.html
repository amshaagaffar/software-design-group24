<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile View</title>
  <link rel="stylesheet" href="Styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      background-color: #ffffff;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .profile-info {
      display: grid;
      gap: 15px;
    }
    .info-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .label {
      font-weight: bold;
      color: #555;
    }
    .value {
      margin-top: 5px;
      color: #333;
    }
    .button-container {
      text-align: center;
      margin-top: 20px;
    }
    .edit-button {
      background-color: #4caf50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      font-size: 16px;
    }
    .edit-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
<header>
  <nav>
    <div class="logo">Hands2Help</div>
    <div class="menu-container">
      <div class="menu"></div> <!-- The menu will be populated dynamically -->
      <div id="notification-container">
        <button class="noti" id="notification-button">
          <img src="resources/notification-newdot-line.svg" alt="Notification" class="noti-button">
        </button>
        <div id="notification-bubble" class="hidden">
          <p id="notification-message"></p>
        </div>
      </div>
      <button id="signout-button" onclick="signOut()" class="signout-button">Sign Out</button>
    </div>
  </nav>
</header>
<div class="container">
  <h1>User Profile</h1>
  <div class="profile-info">
    <div class="info-item">
      <div class="label">Full Name:</div>
      <div class="value" id="fullName"></div>
    </div>
    <div class="info-item">
      <div class="label">Address 1:</div>
      <div class="value" id="address1"></div>
    </div>
    <div class="info-item">
      <div class="label">Address 2:</div>
      <div class="value" id="address2"></div>
    </div>
    <div class="info-item">
      <div class="label">City:</div>
      <div class="value" id="city"></div>
    </div>
    <div class="info-item">
      <div class="label">State:</div>
      <div class="value" id="state"></div>
    </div>
    <div class="info-item">
      <div class="label">Zip code:</div>
      <div class="value" id="zipcode"></div>
    </div>
    <div class="info-item">
      <div class="label">Skills:</div>
      <div class="value" id="skills"></div>
    </div>
    <div class="info-item">
      <div class="label">Preferences:</div>
      <div class="value" id="preferences"></div>
    </div>
    <div class="info-item">
      <div class="label">Availability:</div>
      <div class="value" id="availability"></div>
    </div>
  </div>
  <div class="button-container">
    <!-- Button to redirect to the Edit Profile page -->
    <a href="userprofile.html" class="edit-button">Edit Profile</a>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      // Fetch the current user profile data from the server
      const response = await fetch('/userprofile', {
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        }
      });

      if (response.ok) {
        const profile = await response.json();

        // Function to format and convert UTC date to local time
        const formatDate = (dateString) => {
          const date = new Date(dateString);
          return date.toLocaleDateString();  // You can customize the format here
        };

        // Populate the profile information in the read-only view
        document.getElementById('fullName').textContent = profile.fullName || 'N/A';
        document.getElementById('address1').textContent = profile.address1 || 'N/A';
        document.getElementById('address2').textContent = profile.address2 || 'N/A';
        document.getElementById('city').textContent = profile.city || 'N/A';
        document.getElementById('state').textContent = profile.state || 'N/A';
        document.getElementById('zipcode').textContent = profile.zipcode || 'N/A';
        document.getElementById('skills').textContent = profile.skills ? profile.skills.join(', ') : 'N/A';
        document.getElementById('preferences').textContent = profile.preferences || 'N/A';

        // Format the availability date
        document.getElementById('availability').textContent = profile.availability ? formatDate(profile.availability) : 'N/A';
      } else {
        console.error('Failed to fetch profile');
      }
    } catch (err) {
      console.error('Error fetching profile:', err);
    }
  });
</script>
<!-- SIGN OUT LOGIC -->
<script>
  function signOut() {
    localStorage.removeItem('token'); // Remove token from localStorage
    alert('You have been signed out.');
    window.location.href = 'Login.html'; // Redirect to login page
  }

  document.addEventListener('DOMContentLoaded', function() {
    // No default section to load on page load
  });
</script>

<!--Dash-->
<script>
  async function fetchUserRole() {
    const token = localStorage.getItem('token');
    if (!token) {
      console.error('No token found');
      return;
    }

    try {
      const response = await fetch('/getRole', {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (response.ok) {
        const data = await response.json();
        return data.role;
      } else {
        console.error('Failed to fetch role');
        return null;
      }
    } catch (err) {
      console.error('Error fetching role:', err);
      return null;
    }
  }

  async function updateNavBasedOnRole() {
    const role = await fetchUserRole();

    const menuContainer = document.querySelector('.menu');

    if (role === 'admin') {
      menuContainer.innerHTML += `
        <a href="admin_dashboard.html">Dashboard</a>
      `;
    } else if (role === 'volunteer') {
      menuContainer.innerHTML += `
        <a href="user_dashboard.html">Dashboard</a>
      `;
    } else {
      menuContainer.innerHTML += `
        <a href="Home.html">Home</a>
      `;
    }
  }

  // Run the function to update the navigation on page load
  document.addEventListener('DOMContentLoaded', updateNavBasedOnRole);
</script>

<script>
  document.getElementById('notification-button').addEventListener('click', async () => {
    try {
      const token = localStorage.getItem('token'); // Get the JWT token
      if (!token) throw new Error('User is not logged in');

      const response = await fetch('/api/notifications/reminders', {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });

      if (!response.ok) throw new Error('Failed to fetch reminders');

      const data = await response.json();

      const reminders = data.reminders;
      if (reminders.length > 0) {
        const message = reminders.map(r =>
                `Event: ${r.eventName}\nDate: ${new Date(r.eventDate).toLocaleDateString()}\nLocation: ${r.location}`
        ).join('\n\n');
        document.getElementById('notification-message').innerText = message;
      } else {
        document.getElementById('notification-message').innerText = 'No upcoming events!';
      }

      // Show the bubble
      const bubble = document.getElementById('notification-bubble');
      bubble.classList.add('visible');

      // Auto-hide after 5 seconds
      setTimeout(() => {
        bubble.classList.remove('visible');
      }, 5000);
    } catch (error) {
      console.error(error);
      alert(error.message);
    }
  });
</script>

</body>
</html>
